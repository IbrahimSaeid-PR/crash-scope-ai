[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crashscope-ai"
version = "0.1.0"
description = "Evidence-first traffic incident analysis MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]
ml = ["numpy>=2.1,<3", "opencv-python-headless>=4.10,<5", "torch>=2.6", "transformers>=4.48,<5"]
rag = ["numpy>=2.1,<3", "qdrant-client>=1.12,<2", "langchain-core>=0.3,<1", "langchain-qdrant>=0.2,<1", "langchain-huggingface>=0.1,<1"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
asyncio_mode = "auto"
